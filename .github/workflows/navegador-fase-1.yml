name: Navegador fase 1
on:
  push:
    branches: [fase-1, fase-2]
    paths:
      - 'src/**'
      - 'tests/navegador/**'
      - 'tests/arnes/**'
      - '.github/workflows/navegador-fase-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorrido:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://127.0.0.1:3193
      SUPABASE_PUBLISHABLE_KEY: qa-local
      SUPABASE_SECRET_KEY: qa-local
      NORKA_URL: http://127.0.0.1:3191
      NORKA_QA_OUT: /tmp/norka-evidencia
      NORKA_PYTHON: /tmp/norka-venv/bin/python
      NORKA_AXE: /tmp/norka-qa/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Herramientas de navegador aisladas
        run: |
          python -m venv /tmp/norka-venv
          /tmp/norka-venv/bin/pip install playwright==1.51.0
          /tmp/norka-venv/bin/python -m playwright install --with-deps chromium
          npm install --prefix /tmp/norka-qa --no-save --package-lock=false axe-core@4.10.3
      - name: Arnés completo y navegador aislado
        run: npm run arnes -- --completo
      - name: Evidencia sintética
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: recorrido-norka-1-9
          path: /tmp/norka-evidencia
          if-no-files-found: warn
