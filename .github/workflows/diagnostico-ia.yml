name: Diagnóstico IA sintético
on:
  push:
    branches: [fase-2]
    paths: ['evals/solicitud-diagnostico.json']
permissions:
  contents: read
concurrency:
  group: norka-evaluacion-sintetica
  cancel-in-progress: false
jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Una solicitud ficticia por modelo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EVAL_ACTIVA: '1'
        run: npx --no-install vitest run --config evals/vitest.diagnostico.mts
      - name: Evidencia sin secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-ia
          path: evals/diagnostico.json
          if-no-files-found: ignore
          retention-days: 14
