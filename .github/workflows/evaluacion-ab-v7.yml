name: Gemini · comparación V6 V7 individual
on:
  push:
    branches: [fase-2]
    paths: ['evals/solicitud-ab-v7.json']
permissions:
  contents: read
concurrency:
  group: norka-evaluacion-sintetica
  cancel-in-progress: false
jobs:
  evaluar:
    if: github.ref == 'refs/heads/fase-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificar huellas congeladas y arnés
        run: |
          node --experimental-strip-types --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {z} from 'zod';
          import {instruccionesCapturaV7} from './src/data/prompt-captura-v7.ts';
          import {contratoInternoV7,contratoLoteInternoV7} from './src/core/contracts/interpretacion-interna-v7.ts';
          const f=JSON.parse(readFileSync('docs/inteligencia/CONGELACION-V7.json','utf8'));
          const sha=x=>createHash('sha256').update(x).digest('hex');
          assert.equal(sha(instruccionesCapturaV7),f.instruccion);
          assert.equal(sha(readFileSync('src/core/contracts/interpretacion-interna-v7.ts')),f.esquemaFuente);
          assert.equal(sha(readFileSync('src/core/usecases/validar-interpretacion-v7.ts')),f.validador);
          console.log('Huellas verificadas',JSON.stringify({instruccion:f.instruccion,esquema:sha(JSON.stringify(z.toJSONSchema(contratoInternoV7))),esquemaLote:sha(JSON.stringify(z.toJSONSchema(contratoLoteInternoV7))),validador:f.validador}));
          JS
          test "$(git hash-object evals/captura-cl.json)" = "8a1add2d3bda79cd82db2bfc9166a501aaec5ca6"
          npm run arnes
      - name: A/B individual, detener ante regresión, 429 o cobertura incompleta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EVAL_ACTIVA: '1'
          GEMINI_MODELO: gemini-3.5-flash-lite
          GEMINI_PROMPT_VERSION: AB
          GEMINI_EVAL_TAMANO: '1'
          GEMINI_AB_SEMILLA: '20261126'
        run: npm run eval
      - name: Artefacto exclusivamente sintético
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-individual-v6-v7
          path: evals/salida-eval.json
          if-no-files-found: ignore
          retention-days: 14
