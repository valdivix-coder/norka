name: V7.8 · ablación sin proveedor
on:
  push:
    branches: [ia-universal-v7-8]
    paths: ['tests/arnes/interpretacion-v7-8.test.ts','evals/replay-v7-8.eval.ts','evals/huellas-v7-8.eval.ts','src/core/usecases/validar-interpretacion-v7-8.ts','src/core/usecases/semantica-captura-v7-8.ts','src/data/prompt-captura-v7-8.ts','src/data/gemini-sintetico-v7-8.ts','src/laboratorio/preseleccion-v7-8.ts','evals/metricas-semanticas-v7-8.ts','.github/workflows/replay-v7-8.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run arnes
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-3-desarrollo-desarrollo-v7-3
          run-id: '45994191002'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v73
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-4-desarrollo-desarrollo-v7-4
          run-id: '46034647175'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v74
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-5-desarrollo-desarrollo-v7-5
          run-id: '46037265864'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v75
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-5-desarrollo-desarrollo-v7-4
          run-id: '46039721333'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-resistencia
      - uses: actions/download-artifact@v4
        with:
          name: desarrollo-b-v7-7
          run-id: '46091406954'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-b77
      - run: npx vitest run --config evals/vitest.replay-v7-8.mts
      - run: npx vitest run --config evals/vitest.congelacion-v7-7.mts
      - run: npx vitest run --config evals/vitest.huellas-v7-8.mts
