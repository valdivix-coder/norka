name: Exportar replay sintético (sin proveedor)
# Lee artefactos sintéticos de DESARROLLO ya generados y los imprime con su SHA-256 para construir
# fixtures del laboratorio. No llama a Gemini, no usa secretos de proveedor, no toca la base de datos.
# Excluye deliberadamente cualquier artefacto del corpus oficial.
on:
  push:
    branches: [fase-2]
    paths: ['evals/solicitud-replay.json']
permissions:
  contents: read
  actions: read
jobs:
  exportar:
    if: github.ref == 'refs/heads/fase-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: '45922944781'
            nombre: evaluacion-v7-1-desarrollo-desarrollo-v7-1
          - run: '45923853986'
            nombre: evaluacion-v7-1-desarrollo-desarrollo-v7-1-catalogo
          - run: '45928250323'
            nombre: evaluacion-v7-2-desarrollo-desarrollo-v7-2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: replay
      - name: Imprimir JSON sintético por bloques con huella
        run: |
          node -e '
          const fs=require("fs"),c=require("crypto");
          for(const f of fs.readdirSync("replay")){
            const b=fs.readFileSync("replay/"+f);const j=JSON.parse(b);
            if(j.corpus==="oficial")throw new Error("NO_EXPORTAR_OFICIAL");
            const s=b.toString("base64");const n=Math.ceil(s.length/3000);
            console.log("REPLAY_INICIO",process.env.RUN,f,c.createHash("sha256").update(b).digest("hex"),b.length,n);
            for(let i=0;i<n;i++)console.log("REPLAY_BLOQUE",process.env.RUN,i,s.slice(i*3000,(i+1)*3000));
            console.log("REPLAY_FIN",process.env.RUN);
          }'
        env:
          RUN: ${{ matrix.run }}
