name: Exportar replay sintético (sin proveedor)
# Convierte artefactos sintéticos de DESARROLLO ya generados en fixtures con procedencia y SHA-256,
# y los guarda en fase-2. No llama a Gemini, no usa el secreto del proveedor, no toca la base de datos.
# El script rechaza cualquier artefacto del corpus oficial.
on:
  push:
    branches: [fase-2]
    paths: ['evals/solicitud-replay.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: norka-exportar-replay
  cancel-in-progress: false
jobs:
  exportar:
    if: github.ref == 'refs/heads/fase-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with: {name: evaluacion-v7-1-desarrollo-desarrollo-v7-1, run-id: '45922944781', github-token: '${{ secrets.GITHUB_TOKEN }}', path: r1}
      - uses: actions/download-artifact@v4
        with: {name: evaluacion-v7-1-desarrollo-desarrollo-v7-1-catalogo, run-id: '45923853986', github-token: '${{ secrets.GITHUB_TOKEN }}', path: r2}
      - uses: actions/download-artifact@v4
        with: {name: evaluacion-v7-2-desarrollo-desarrollo-v7-2, run-id: '45928250323', github-token: '${{ secrets.GITHUB_TOKEN }}', path: r3}
      - name: Construir fixtures
        run: |
          node scripts/exportar-fixtures-laboratorio.mjs r1 45922944781 15165543123 evaluacion-v7-1-desarrollo-desarrollo-v7-1
          node scripts/exportar-fixtures-laboratorio.mjs r2 45923853986 15165492608 evaluacion-v7-1-desarrollo-desarrollo-v7-1-catalogo
          node scripts/exportar-fixtures-laboratorio.mjs r3 45928250323 15166769133 evaluacion-v7-2-desarrollo-desarrollo-v7-2
      - name: Guardar en fase-2
        run: |
          git config user.name "norka-replay[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/laboratorio/fixtures
          git commit -m "Fixtures de replay sintético exportados desde artefactos de desarrollo (sin proveedor)" || echo "sin cambios"
          git push origin HEAD:fase-2
