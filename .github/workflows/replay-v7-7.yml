name: V7.7 · ablación sin proveedor
on:
  push:
    branches: [ia-universal-v7-7]
    paths: ['evals/replay-v7-7.eval.ts','src/core/usecases/validar-interpretacion-v7-7.ts','evals/metricas-acciones-v7-7.ts','.github/workflows/replay-v7-7.yml','evals/listas-v7-7.eval.ts']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run arnes
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-3-desarrollo-desarrollo-v7-3
          run-id: '45994191002'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v73
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-4-desarrollo-desarrollo-v7-4
          run-id: '46034647175'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v74
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-5-desarrollo-desarrollo-v7-5
          run-id: '46037265864'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-v75
      - uses: actions/download-artifact@v4
        with:
          name: evaluacion-v7-5-desarrollo-desarrollo-v7-4
          run-id: '46039721333'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/replay-resistencia
      - run: npx vitest run --config evals/vitest.replay-v7-7.mts
      - uses: actions/download-artifact@v4
        with:
          name: laboratorio-norka-sintetico
          run-id: '46070603304'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: /tmp/v77-lab
      - run: npx vitest run --config evals/vitest.listas-v7-7.mts
      - run: npx vitest run --config evals/vitest.auditoria-universal.mts
